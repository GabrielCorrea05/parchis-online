[package]
name = "gabrielcorrea05/parchis-online"
version = "0.1.0"
description = "Parchís online para 2 a 6 jugadores"
private = false

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."
"/config" = "config"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]
env = ["PHPRC=/config/"]
